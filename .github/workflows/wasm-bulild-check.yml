permissions:
  contents: read

name: CI wasm-check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-ci:
    name: Check wasm build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable 2 weeks ago

      - name: Install wasm-pack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: wasm-pack
          checksum: true

      - name: wasm build
        shell: bash
        run: make euclid-wasm

      - name: payment-link wasm build
        shell: bash
        run: make payment-link-wasm
